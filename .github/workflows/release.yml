name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  attestations: write
  artifact-metadata: write
  id-token: write

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify release commit is on main
        shell: pwsh
        run: |
          git fetch --no-tags origin main
          $peeledTagRef = git ls-remote --tags origin "refs/tags/$env:GITHUB_REF_NAME^{}"
          if ([string]::IsNullOrWhiteSpace($peeledTagRef)) {
            throw "Release tag $env:GITHUB_REF_NAME must be an annotated tag."
          }
          $tagCommit = ($peeledTagRef -split '\s+')[0]
          git merge-base --is-ancestor $tagCommit origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag $env:GITHUB_REF_NAME must point to a commit reachable from main."
          }

      - name: Setup .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Verify tag matches project version
        shell: pwsh
        run: |
          [xml]$project = Get-Content AgentCompanion.csproj
          $version = ([string]($project.Project.PropertyGroup.VersionPrefix | Where-Object { $_ })).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match project version v$version."
          }

      - name: Restore
        run: dotnet restore AgentCompanion.sln --locked-mode

      - name: Verify formatting
        run: dotnet format AgentCompanion.sln --verify-no-changes --no-restore

      - name: Verify text encoding
        shell: pwsh
        run: ./tools/Test-TextEncoding.ps1

      - name: Verify documentation assets
        shell: pwsh
        run: ./tools/Test-DocumentationAssets.ps1

      - name: Build
        run: dotnet build AgentCompanion.sln -c Release --no-restore

      - name: Test
        run: dotnet test AgentCompanion.Tests/AgentCompanion.Tests.csproj -c Release --no-build --no-restore

      - name: Audit NuGet packages
        run: dotnet list AgentCompanion.csproj package --vulnerable --include-transitive

      - name: Publish
        run: dotnet publish AgentCompanion.csproj -c Release -r win-x64 --self-contained true --no-restore -o publish/AgentCompanion

      - name: Package release
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          ./tools/New-ReleasePackage.ps1 `
            -PublishDirectory publish/AgentCompanion `
            -Version $tag `
            -OutputDirectory dist
          ./tools/Test-ReleasePackage.ps1 -ArchivePath "dist/AgentCompanion-$tag-win-x64.zip"

          $version = $tag.TrimStart("v")
          $lines = Get-Content CHANGELOG.md
          $start = -1
          $end = $lines.Count
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^## $([regex]::Escape($version))\s+-") {
              $start = $i
              continue
            }
            if ($start -ge 0 -and $lines[$i] -match "^## ") {
              $end = $i
              break
            }
          }
          if ($start -lt 0) {
            throw "CHANGELOG entry for $version was not found."
          }
          $lines[($start + 1)..($end - 1)] | Set-Content "dist/release-notes.md" -Encoding utf8

      - name: Attest release archive provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: |
            dist/AgentCompanion-${{ github.ref_name }}-win-x64.zip
            dist/SHA256SUMS.txt

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release create $tag `
            "dist/AgentCompanion-$tag-win-x64.zip" `
            "dist/SHA256SUMS.txt" `
            --verify-tag `
            --title "AgentCompanion $tag" `
            --notes-file "dist/release-notes.md"
